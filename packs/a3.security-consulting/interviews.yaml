# /interview 질문 은행 — 답변에는 고객명·시스템명·IP 를 쓰지 않는다 (고객 유형으로만 일반화).
questions:
  - id: sec-method-skip
    domain: SEC-CONSULT
    sub_moc: 진단 방법론
    prompt: 표준 진단 절차에서 현장 사정으로 건너뛴 단계가 있었나? 그 결과 무엇을 놓쳤거나, 반대로 불필요했다고 확인됐나?
  - id: sec-preengagement-scope
    domain: SEC-CONSULT
    sub_moc: 진단 방법론
    prompt: 사전 협의(PTES 1단계)에서 범위나 수행 규칙을 모호하게 남겨 수행 중 문제가 된 적이 있나? 이제 착수 전에 반드시 문서로 받는 항목은?
    follow_ups: [중단 조건과 비상 연락 체계는 어떻게 합의했나?]
    yields: checklist
  - id: sec-intel-gathering
    domain: SEC-CONSULT
    sub_moc: 진단 방법론
    prompt: 정보 수집 단계에서 가장 값졌던 공개 정보 유형은 무엇이었나? 수집 범위를 넘지 않기 위해 스스로 둔 한계는?
  - id: sec-vuln-false-positive
    domain: SEC-CONSULT
    sub_moc: 진단 방법론
    prompt: 자동 도구 결과를 그대로 믿었다가 오탐으로 드러난 사례가 있나? 지금은 어떤 수동 검증을 거쳐 발견 사항으로 확정하나?
    yields: checklist
  - id: sec-exploit-stop
    domain: SEC-CONSULT
    sub_moc: 진단 방법론
    prompt: 익스플로잇을 멈추기로 한 판단 — 어떤 신호에서 멈췄고, 영향 입증은 어디까지면 충분하다고 봤나?
    yields: adr
  - id: sec-post-exploit-cleanup
    domain: SEC-CONSULT
    sub_moc: 진단 방법론
    prompt: 후속 공격 단계 뒤 정리(생성한 계정·파일·설정 원복)에서 빠뜨릴 뻔한 것은? 정리 목록을 어떻게 관리하나?
    yields: checklist
  - id: sec-compliance-gap
    domain: SEC-CONSULT
    sub_moc: 컴플라이언스(ISMS-P 등)
    prompt: 인증 기준은 충족했지만 실제 위험은 남아 있던 항목이 있었나? 고객에게 그 차이를 어떻게 설명했나?
  - id: sec-annex-org
    domain: SEC-CONSULT
    sub_moc: 컴플라이언스(ISMS-P 등)
    prompt: 조직적 통제(정책·역할·공급자 관리)에서 문서는 있으나 운영 증적이 없던 전형적인 패턴은? 어떤 질문으로 드러났나?
  - id: sec-annex-people
    domain: SEC-CONSULT
    sub_moc: 컴플라이언스(ISMS-P 등)
    prompt: 인적 통제(교육·퇴직자 처리·비밀유지)에서 반복해서 보는 미흡 사항은? 현실적으로 받아들여진 개선안은?
  - id: sec-annex-physical
    domain: SEC-CONSULT
    sub_moc: 컴플라이언스(ISMS-P 등)
    prompt: 물리적 통제 점검에서 서류 심사만으로는 알 수 없고 현장에서만 확인된 것은?
  - id: sec-annex-tech
    domain: SEC-CONSULT
    sub_moc: 컴플라이언스(ISMS-P 등)
    prompt: 기술적 통제(접근 권한·로깅·백업·취약점 관리) 중 '설정은 됐지만 작동하지 않던' 사례는? 작동 여부를 어떻게 검증하나?
    yields: checklist
  - id: sec-soa-justification
    domain: SEC-CONSULT
    sub_moc: 컴플라이언스(ISMS-P 등)
    prompt: 적용성 보고서에서 통제 제외 사유가 약했던 경우, 어떤 근거를 요구했고 무엇이 설득력 있었나?
  - id: sec-threat-model-miss
    domain: SEC-CONSULT
    sub_moc: 위협 모델링
    prompt: 위협 모델링에서 빠뜨렸다가 나중에 드러난 공격 경로가 있나? 다음 모델링에 추가할 질문은?
    yields: checklist
  - id: sec-threat-model-priority
    domain: SEC-CONSULT
    sub_moc: 위협 모델링
    prompt: 시간이 부족할 때 위협 모델에서 무엇을 먼저 보나? 그 우선순위가 틀렸던 적은?
  - id: sec-finding-severity
    domain: SEC-CONSULT
    sub_moc: 발견 사항·대책
    prompt: CVSS 점수와 실제 업무 위험이 크게 달랐던 발견 사항은? 위험도를 조정한 근거를 어떻게 적었나?
  - id: sec-finding-root-cause
    domain: SEC-CONSULT
    sub_moc: 발견 사항·대책
    prompt: 여러 발견 사항이 하나의 근본 원인(예 구성 관리 부재)으로 묶였던 경우, 개별 대책 대신 무엇을 권고했나?
  - id: sec-countermeasure-rejected
    domain: SEC-CONSULT
    sub_moc: 발견 사항·대책
    prompt: 기술적으로 옳지만 고객이 이행할 수 없었던 대책은? 대신 제시한 임시 완화와 그 한계는?
    yields: adr
  - id: sec-risk-acceptance
    domain: SEC-CONSULT
    sub_moc: 발견 사항·대책
    prompt: 위험 수용으로 종결된 항목에서, 수용 결정이 유효하려면 어떤 조건(승인자·기한·재검토)을 갖춰야 했나?
  - id: sec-remediation-drift
    domain: SEC-CONSULT
    sub_moc: 이행·재진단
    prompt: 이행 완료로 보고됐지만 재진단에서 다시 열린 항목의 공통 원인은? 이행 기록에 무엇이 있었으면 미리 알 수 있었나?
    yields: checklist
  - id: sec-retest-scope
    domain: SEC-CONSULT
    sub_moc: 이행·재진단
    prompt: 재진단 범위를 '조치된 항목만'으로 한정했을 때 놓친 회귀나 우회 경로가 있었나? 재진단 범위를 정하는 기준은?
  - id: sec-retest-evidence
    domain: SEC-CONSULT
    sub_moc: 이행·재진단
    prompt: 재진단에서 '해소'로 판정하려면 어떤 증적이 필요하다고 보나? 증적 없이 구두 확인만 있던 경우 어떻게 처리했나?
  - id: sec-report-pushback
    domain: SEC-CONSULT
    sub_moc: 보고서 작성
    prompt: 보고서의 어떤 표현이 고객 반발을 불렀나? 같은 사실을 어떻게 다시 썼나?
  - id: sec-report-exec-summary
    domain: SEC-CONSULT
    sub_moc: 보고서 작성
    prompt: 경영진 요약에서 기술 용어 없이 위험을 전달하는 데 효과가 있었던 구성은? 넣지 말아야 했던 것은?
  - id: sec-report-repro
    domain: SEC-CONSULT
    sub_moc: 보고서 작성
    prompt: 재현 절차를 고객 담당자가 따라 하지 못했던 경우, 무엇이 빠져 있었나?
    yields: checklist
  - id: sec-customer-type
    domain: SEC-CONSULT
    sub_moc: 고객 커뮤니케이션
    prompt: 이 고객 유형(금융/공공/제조/플랫폼)에서만 통하는 커뮤니케이션 규칙이 있나? 고객명 없이 일반화해 말해라.
    follow_ups: [그 규칙을 어기면 보통 무슨 일이 생기나?]
  - id: sec-critical-finding-escalation
    domain: SEC-CONSULT
    sub_moc: 고객 커뮤니케이션
    prompt: 수행 중 치명적 발견을 최종 보고 전에 즉시 알려야 했던 상황 — 누구에게, 어떤 경로로, 무엇을 전달했나?
  - id: sec-scope-change
    domain: SEC-CONSULT
    sub_moc: 고객 커뮤니케이션
    prompt: 수행 도중 범위 변경 요청을 받았을 때 수락·거절을 가른 기준은? 기록은 어떻게 남겼나?
    yields: adr
