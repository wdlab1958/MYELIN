# Org Pack (예시·초안) — 침해사고 대응 조직용 출발점. Sub-MOC·용어는 팀 챔피언과 확정한다 (P7-T5).
# 실제 조직은 이 Pack을 복사해 자기 private 저장소에서 `<org>.incident-response` 로 운영한다.
pack: org.incident-response
version: 0.1.0
kind: org
maintainer: Example Org AI WG
description: 침해사고 대응 지식 — 타임라인, IoC(비식별 규칙 포함), 사후 분석 (초안)
requires:
  - myelin.core>=1.0

domains:
  - id: INCIDENT-RESP
    label: IR
    name: 침해사고 대응
    accent: magenta
    description: 사고 대응 절차와 사후 분석 교훈을 축적한다. 원 사고 자료는 Vault에 두지 않는다.
    sub_mocs:
      - 탐지 · 분석
      - 격리 · 근절 · 복구
      - 타임라인 재구성
      - 사후 분석 (Post-mortem)
      - 대응 플레이북
    note_types: [lesson, checklist, evergreen, adr]
    taxonomy_seed: taxonomy.yaml
    templates: templates
    interview_bank: interviews.yaml
    classification_default: confidential
    compose_targets: [사고 보고서 초안, 플레이북 개정안, 교육자료]
