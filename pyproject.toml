[project]
name = "myelin-workspace"
version = "0.0.0"
description = "MYELIN Personal Knowledge OS — monorepo workspace root"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "myelin-core",
    "myelin-cli",
    "myelin-mcp",
    "myelin-hub-api",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/myelin-core",
    "packages/myelin-cli",
    "packages/myelin-mcp",
    "packages/myelin-hub/api",
]

[tool.uv.sources]
myelin-core = { workspace = true }
myelin-cli = { workspace = true }
myelin-mcp = { workspace = true }
myelin-hub-api = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["myelin_core", "myelin_cli", "myelin_mcp", "myelin_hub_api"]
mypy_path = [
    "packages/myelin-core/src",
    "packages/myelin-cli/src",
    "packages/myelin-mcp/src",
    "packages/myelin-hub/api/src",
]

[tool.pytest.ini_options]
testpaths = ["packages", "tests"]
addopts = "-q --import-mode=importlib"
