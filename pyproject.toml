[project]
name = "myelin-workspace"
version = "0.0.0"
description = "MYELIN — Personal Knowledge OS (uv workspace root; not a distributable package)"
requires-python = ">=3.12"
dependencies = [
  "myelin-core",
  "myelin-cli",
  "myelin-mcp",
  "myelin-hub-api",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "packages/myelin-core",
  "packages/myelin-cli",
  "packages/myelin-mcp",
  "packages/myelin-hub/api",
]

[tool.uv.sources]
myelin-core = { workspace = true }
myelin-cli = { workspace = true }
myelin-mcp = { workspace = true }
myelin-hub-api = { workspace = true }

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = [
  "packages/myelin-core/src",
  "packages/myelin-cli/src",
  "packages/myelin-mcp/src",
  "packages/myelin-hub/api/src",
]
extend-exclude = ["docs", "theme", "design", "tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "N", "ANN", "PTH"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["ANN"]
"scripts/**" = ["ANN"]
"scripts/split_phases.py" = ["E501"]  # Task 목록 데이터 문자열(한국어)
"scripts/gen_fixture_vault.py" = ["E501"]  # fixture 데이터 테이블
"scripts/gen_seeded_vault.py" = ["E501"]  # fixture 데이터 테이블
"scripts/gen_perf_vault.py" = ["E501"]  # 어휘 테이블
"scripts/emboss.py" = ["E501"]  # CSS 템플릿 리터럴
"packages/myelin-core/src/myelin_core/render.py" = ["E501"]  # 렌더 템플릿 리터럴(한국어)

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = [
  "packages/myelin-core/src",
  "packages/myelin-cli/src",
  "packages/myelin-mcp/src",
  "packages/myelin-hub/api/src",
  "scripts",
  "tests",
]
namespace_packages = true
explicit_package_bases = true
exclude = ["tests/fixtures", "docs", "theme", "design"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = [
  "packages/myelin-core/tests",
  "packages/myelin-cli/tests",
  "packages/myelin-mcp/tests",
  "packages/myelin-hub/api/tests",
  "tests",
]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
  "e2e: end-to-end tests (Hub/Plugin), skipped unless MYELIN_E2E=1",
  "gate: Phase gate checks",
  "perf: performance benchmarks, skipped unless MYELIN_PERF=1",
]
