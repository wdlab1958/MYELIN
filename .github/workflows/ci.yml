name: CI

on:
  push:
    branches: [main]
    tags: ["phase-P*", "v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --all-packages --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q
  gate:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/myelin-hub/web/package-lock.json
      - name: Install Hub web deps + Claude Code CLI (plugin validate)
        run: |
          npm ci --prefix packages/myelin-hub/web --no-audit --no-fund
          npm install -g @anthropic-ai/claude-code
      - run: uv sync --all-packages --group dev
      - name: Resolve current phase from PHASE_STATE.md
        id: phase
        run: echo "n=$(sed -n 's/^current_phase: P\([0-9]\)$/\1/p' PHASE_STATE.md)" >> "$GITHUB_OUTPUT"
      - run: make gate P=${{ steps.phase.outputs.n }}
        env:
          MYELIN_PERF: "1"
