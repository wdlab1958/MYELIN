# W5 regression guard — WDLAB-STD-VERIFY-001 §13 (fail-closed)
# Generated 2026-11-16, extended 2026-11-18 (4 concerns + Lean). Three-config TLC gate + Lean trust audit + W6 drift check.
name: formal-verification
on:
  pull_request:
    paths: ["formal/**", "packages/myelin-core/src/**", "packages/myelin-hub/api/src/**", "packages/myelin-hub/web/src/**", "packages/myelin-cli/src/**", "plugin/hooks/**", "docs/adr/**", "PHASE_STATE.md", "README.md"]
  push:
    branches: ["main"]
    paths: ["formal/**", "packages/myelin-core/src/**", "packages/myelin-hub/api/src/**", "packages/myelin-hub/web/src/**", "packages/myelin-cli/src/**", "plugin/hooks/**", "docs/adr/**", "PHASE_STATE.md", "README.md"]
  schedule:
    - cron: "17 18 * * *"   # nightly 03:17 KST
  workflow_dispatch:
concurrency:
  group: formal-${{ github.ref }}
  cancel-in-progress: true
jobs:
  three-config-gate:
    name: TLC three-config gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TLC_WORKERS: "2"
      PROOF_SKILLS_TOOLS: ${{ github.workspace }}/.proof-skills-tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Cache TLA+ tools
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.proof-skills-tools
          key: tla2tools-v1.8.0-${{ runner.os }}
      - name: Fetch pinned TLA+ tools
        run: bash formal/ci/setup_tla.sh
      - name: Three-config gate (MC PASS / MC_bug FAIL / MC_sanity FAIL)
        env:
          FORMAL_NIGHTLY: ${{ github.event_name == 'schedule' && '1' || '0' }}   # larger bounds at night
        run: bash formal/run_all.sh
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formal-evidence-${{ github.run_id }}
          path: |
            formal/**/.tlc-out/**/tlc.log
            formal/**/evidence/*.log
          if-no-files-found: ignore
          retention-days: 14
  lean-trust-audit:
    name: Lean trust audit (0 sorry, standard axioms)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install elan (toolchain pinned by each project's lean-toolchain)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: lake build + axiom audit
        run: bash formal/lean_audit.sh
  drift-check:
    name: W6 correspondence drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Model → code pointers still resolve
        run: python3 formal/tools/correspondence_check.py formal/ --root .
      - name: Mapped source files changed in this PR (review required)
        if: github.event_name == 'pull_request'
        run: python3 formal/tools/correspondence_check.py formal/ --root . --since "origin/${{ github.base_ref }}"
