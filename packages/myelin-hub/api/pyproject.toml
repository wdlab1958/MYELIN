[project]
name = "myelin-hub-api"
version = "0.0.1"
description = "MYELIN Hub API (FastAPI) — dashboard, review gate, onboarding"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["myelin-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/myelin_hub_api"]
