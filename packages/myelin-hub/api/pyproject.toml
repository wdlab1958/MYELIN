[project]
name = "myelin-hub-api"
version = "0.1.0a0"
description = "MYELIN Hub API: FastAPI backend for the web dashboard"
requires-python = ">=3.12"
dependencies = [
  "myelin-core",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/myelin_hub_api"]
