[project]
name = "myelin-core"
version = "0.0.1"
description = "MYELIN core — frontmatter schema, note parser, Domain Pack loader, doctor, index"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "ruamel-yaml>=0.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/myelin_core"]
