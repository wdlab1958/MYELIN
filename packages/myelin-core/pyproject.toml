[project]
name = "myelin-core"
version = "0.1.0a0"
description = "MYELIN core: schema, note parser, Pack loader, doctor, index (shared by CLI/MCP/Hub)"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8",
  "ruamel.yaml>=0.18",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/myelin_core"]
