[project]
name = "myelin-cli"
version = "1.0.0"
description = "MYELIN CLI — init / add-domain / doctor / stats"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "myelin-core",
    "typer>=0.12",
]

[project.scripts]
myelin = "myelin_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/myelin_cli"]
