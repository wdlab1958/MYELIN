[project]
name = "myelin-cli"
version = "0.0.1"
description = "MYELIN CLI — init / add-domain / doctor / stats"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["myelin-core"]

[project.scripts]
myelin = "myelin_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/myelin_cli"]
