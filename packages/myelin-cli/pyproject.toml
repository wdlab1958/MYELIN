[project]
name = "myelin-cli"
version = "0.1.0a0"
description = "MYELIN CLI: init / add-domain / doctor / stats"
requires-python = ">=3.12"
dependencies = [
  "myelin-core",
  "typer>=0.12",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/myelin_cli"]

[project.scripts]
myelin = "myelin_cli.__main__:main"
