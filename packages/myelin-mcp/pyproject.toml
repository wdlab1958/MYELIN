[project]
name = "myelin-mcp"
version = "0.0.1"
description = "MYELIN MCP server — read-only Vault search and lookup"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["myelin-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/myelin_mcp"]
