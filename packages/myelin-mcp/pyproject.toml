[project]
name = "myelin-mcp"
version = "0.1.0a0"
description = "MYELIN MCP server: read-only Vault search/query over stdio"
requires-python = ">=3.12"
dependencies = [
  "myelin-core",
  "mcp>=1.2",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/myelin_mcp"]
