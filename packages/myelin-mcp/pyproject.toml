[project]
name = "myelin-mcp"
version = "1.0.0"
description = "MYELIN MCP server — read-only Vault search and lookup"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "myelin-core",
]

[project.scripts]
myelin-mcp = "myelin_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/myelin_mcp"]
